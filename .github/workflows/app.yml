name: Build
on:
  push:
    branches: [main, feat/zh-Hans-localization]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dylib
        run: make -j$(sysctl -n hw.ncpu)

      - name: Build config app
        working-directory: macsteam-app
        run: ./make_app.sh

      - name: Package DMG
        run: |
          hdiutil create \
            -volname "macSteam Config" \
            -srcfolder "macsteam-app/macSteam Config.app" \
            -ov -format UDZO \
            "macSteam-zh-Hans.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macSteam-zh-Hans-DMG
          path: macSteam-zh-Hans.dmg
          if-no-files-found: error
