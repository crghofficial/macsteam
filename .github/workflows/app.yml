name: Build
on:
  push:
    branches: [main, feat/zh-Hans-localization]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dylib
        run: make -j$(sysctl -n hw.ncpu)

      - name: Build config app
        working-directory: macsteam-app
        run: ./make_app.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macSteam-zh-Hans-macOS
          path: macsteam-app/macSteam Config.app
          if-no-files-found: error
